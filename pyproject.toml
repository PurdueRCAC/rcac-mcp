[project]
name = "rcac-mcp"
version = "0.1.2"
description = "Purdue RCAC MCP Server: Enables agentic development with HPC clusters and storage services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4,<5",
    "cmdkit>=2.7.7",
    "pyjwt>=2.0",
    "fabric>=3.0",
]

[project.scripts]
rcac-mcp = "rcac_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcac_mcp"]

[tool.hatch.build.targets.sdist]
# The sandbox helper, the design records, the backlog, and the hidden security lane are
# repository furniture, not distribution content. `.security/` is the one that matters: shipping
# it would publish an inventory of unremediated weaknesses. The release recipe's gate in
# AGENTS.md re-checks the built tarball because this list only covers the directories that
# exist today.
exclude = [
    "/bin",
    "/.security",
    "/.local",
    "/spec",
    "/issues",
    "/tests/fixtures",
    "/certs",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# The oldest uv this project supports. uv 0.5.14 and later read this field, so 0.5.14 up to 0.12.16
# refuse to sync, lock or run the project, naming 0.12.17; uv 0.5.13 and earlier predate it, warn
# about an unknown field and run.
required-version = ">=0.12.17"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: fast and isolated; no subprocess, no network, no real cluster",
    "integration: drives the installed CLI; run it under bin/sandbox.sh",
]
